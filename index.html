<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5S SMA BENTARA WACANA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation; 
        }

 
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 4px;
        }

      
        .hardware-accelerated {
            transform: translateZ(0);
            will-change: transform;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-300 via-indigo-200 to-cyan-200 text-slate-800 relative overflow-x-hidden selection:bg-blue-400 selection:text-white">

    <div class="fixed top-[-10%] left-[-10%] w-72 h-72 bg-blue-400/40 rounded-full blur-[60px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-72 h-72 bg-indigo-300/40 rounded-full blur-[60px] pointer-events-none"></div>

    <div class="relative z-10 max-w-6xl mx-auto p-3 sm:p-4 min-h-screen flex flex-col">
        
        <header class="bg-white/60 backdrop-blur-md border border-white/60 shadow-sm p-3.5 sm:p-4 rounded-2xl mt-1 mb-4 flex flex-col sm:flex-row justify-between items-center gap-3 hardware-accelerated">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-xl shadow-md flex items-center justify-center text-white shrink-0">
                    <i data-lucide="calendar" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight text-slate-800 leading-tight">5S SMA BENTARA WACANA</h1>
                    <p class="text-slate-500 font-medium text-xs sm:text-sm">Absen</p>
                </div>
            </div>
            <div class="flex items-center justify-between sm:justify-end gap-2 bg-white/70 backdrop-blur-sm px-3 py-1.5 rounded-xl border border-white/80 shadow-sm w-full sm:w-auto">
                <span class="text-xs sm:text-sm font-semibold text-slate-600">Tanggal:</span>
                <input type="date" id="currentDate" class="bg-transparent text-blue-700 font-bold text-sm border-none focus:ring-0 cursor-pointer outline-none">
            </div>
        </header>

        <div class="flex p-1 space-x-1 bg-white/40 backdrop-blur-md rounded-2xl border border-white/60 shadow-sm w-full md:w-max mx-auto mb-6">
            <button onclick="switchTab('absensi')" id="tabBtnAbsensi" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 sm:px-6 py-2.5 rounded-xl font-bold text-sm transition-all bg-white text-blue-700 shadow-sm">
                <i data-lucide="users" class="w-4 h-4"></i>
                <span>Absensi</span>
            </button>
            <button onclick="switchTab('kelola')" id="tabBtnKelola" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 sm:px-6 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-white/30">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span>Kelas</span>
            </button>
            <button onclick="switchTab('export')" id="tabBtnExport" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 sm:px-6 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-white/30">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Export</span>
            </button>
        </div>

        <main class="flex-1">
            
            <div id="sectionAbsensi" class="bg-white/50 backdrop-blur-md rounded-2xl shadow-sm border border-white/60 overflow-hidden flex flex-col hardware-accelerated">
                <div class="p-4 sm:p-6 border-b border-white/40 flex flex-col gap-3 bg-white/20">
                    <div class="flex items-center gap-2">
                        <div class="bg-blue-600 p-1.5 rounded-lg text-white">
                            <i data-lucide="users" class="w-4 h-4"></i>
                        </div>
                        <span class="font-bold text-slate-700 text-sm sm:text-base">Pilih Kelas:</span>
                    </div>
                    <div id="classListPills" class="flex gap-2 overflow-x-auto pb-1 custom-scrollbar"></div>
                    <div id="totalStudentsBadge" class="bg-white/70 border border-white/80 text-slate-700 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-sm w-max">
                        0 Siswa Terdaftar
                    </div>
                </div>

                <div class="overflow-x-auto p-1 sm:p-2">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="text-slate-500 text-[11px] sm:text-xs font-bold uppercase tracking-wider border-b border-white/40">
                                <th class="p-3 sm:p-4 w-12 text-center">No</th>
                                <th class="p-3 sm:p-4">Nama Siswa</th>
                                <th class="p-3 sm:p-4 w-48 sm:w-56">Jam Masuk</th>
                                <th class="p-3 sm:p-4 w-64 sm:w-72 text-center">Status 5S & Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody" class="divide-y divide-white/20"></tbody>
                    </table>
                </div>
            </div>

            <div id="sectionKelola" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 hardware-accelerated">
                <div class="md:col-span-1 flex flex-col gap-4 sm:gap-6">
                    <div class="bg-white/50 backdrop-blur-md rounded-2xl shadow-sm border border-white/60 p-4 sm:p-6">
                        <div class="flex items-center gap-2.5 border-b border-white/40 pb-3 mb-3">
                            <div class="p-2 bg-indigo-600 rounded-xl text-white shadow-sm">
                                <i data-lucide="settings" class="w-4 h-4"></i>
                            </div>
                            <h3 class="text-base sm:text-lg font-bold text-slate-800">Pengaturan Kelas</h3>
                        </div>
                        
                        <div>
                            <label class="block text-xs sm:text-sm font-bold text-slate-600 mb-1.5">Pilih Kelas:</label>
                            <select id="manageClassSelect" onchange="onManageClassChange(this.value)" class="w-full bg-white/70 border border-white/80 rounded-xl p-2.5 sm:p-3 text-sm font-bold text-slate-800 outline-none shadow-sm cursor-pointer"></select>
                        </div>

                        <div id="editClassContainer" class="pt-3 mt-2">
                            <label class="block text-xs sm:text-sm font-bold text-slate-600 mb-1.5">Edit Nama Kelas:</label>
                            <div id="editClassViewMode" class="flex justify-between items-center bg-white/60 border border-white/70 p-3 rounded-xl shadow-sm mb-3">
                                <span id="currentClassNameLabel" class="font-extrabold text-indigo-900 text-sm">-</span>
                                <button onclick="enableEditClassName()" class="p-2 bg-white text-indigo-600 rounded-lg shadow-sm border border-indigo-100" title="Edit">
                                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <div id="editClassEditMode" class="hidden flex gap-2 mb-3">
                                <input type="text" id="inputEditClassName" class="w-full bg-white/80 border border-white/90 rounded-xl p-2.5 text-sm font-bold text-slate-800 outline-none">
                                <button onclick="saveClassName()" class="p-2.5 bg-emerald-500 text-white rounded-xl shadow-sm">
                                    <i data-lucide="save" class="w-4 h-4"></i>
                                </button>
                                <button onclick="cancelEditClassName()" class="p-2.5 bg-white text-slate-600 rounded-xl shadow-sm border">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                            
                            <button onclick="removeCurrentClass()" class="w-full flex items-center justify-center gap-2 bg-rose-50 hover:bg-rose-500 text-rose-600 hover:text-white p-2.5 rounded-xl transition-all font-bold text-sm shadow-sm border border-rose-100">
                                <i data-lucide="trash-2" class="w-4 h-4"></i> Hapus Kelas Ini
                            </button>
                        </div>
                    </div>

                    <div class="bg-white/50 backdrop-blur-md rounded-2xl shadow-sm border border-white/60 p-4 sm:p-6">
                        <h3 class="text-sm sm:text-base font-bold text-slate-800 mb-3">Tambah Kelas Baru</h3>
                        <div class="flex flex-col gap-2.5">
                            <input type="text" id="inputNewClassName" placeholder="Nama kelas baru..." class="bg-white/70 border border-white/80 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-800 outline-none">
                            <button onclick="addNewClass()" class="bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-bold shadow-md flex items-center justify-center gap-2 active:scale-95 transition-transform">
                                <i data-lucide="plus" class="w-4 h-4"></i> Buat Kelas
                            </button>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-2 bg-white/50 backdrop-blur-md rounded-2xl shadow-sm border border-white/60 p-4 sm:p-6 flex flex-col">
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-white/40">
                        <div class="flex items-center gap-2">
                            <div class="p-2 bg-blue-600 rounded-xl text-white shadow-sm">
                                <i data-lucide="users" class="w-4 h-4"></i>
                            </div>
                            <h3 id="manageStudentsTitle" class="text-base sm:text-lg font-bold text-slate-800">Daftar Siswa</h3>
                        </div>
                        <span id="manageStudentsCountBadge" class="bg-white/70 border border-white/80 text-blue-800 text-xs sm:text-sm font-extrabold px-3 py-1 rounded-full shadow-sm">
                            0 Total
                        </span>
                    </div>
                    
                    <div class="flex gap-2 mb-4 bg-white/60 p-1.5 rounded-xl border border-white/70 shadow-inner">
                        <input type="text" id="inputNewStudentName" placeholder="Ketik nama siswa..." class="flex-1 bg-transparent border-none px-3 py-1.5 text-sm font-bold text-slate-800 outline-none placeholder-slate-400">
                        <button onclick="addNewStudent()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm flex items-center gap-1.5 active:scale-95 transition-transform">
                            <i data-lucide="plus" class="w-4 h-4" stroke-width="2.5"></i> Tambah
                        </button>
                    </div>

                    <div id="studentListContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 overflow-y-auto pr-1" style="max-height: calc(100vh - 350px);"></div>
                </div>
            </div>

            <div id="sectionExport" class="hidden bg-white/50 backdrop-blur-md rounded-2xl shadow-sm border border-white/60 p-6 sm:p-12 flex flex-col items-center justify-center min-h-[400px] text-center hardware-accelerated">
                <div class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-tr from-emerald-400 to-teal-400 rounded-2xl shadow-lg flex items-center justify-center mb-6 text-white">
                    <i data-lucide="download" class="w-10 h-10 sm:w-12 sm:h-12" stroke-width="2.5"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-2">Siap Diekspor</h2>
                <p class="text-slate-600 mb-8 max-w-md text-sm sm:text-base font-medium">
                    Unduh data absensi Anda dalam format CSV untuk dibuka di Excel atau Google Spreadsheet.
                </p>
                
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <button onclick="exportCurrentClassCSV()" class="flex items-center justify-center gap-2 bg-white/80 border border-white hover:bg-white text-emerald-700 px-6 py-3.5 rounded-xl font-bold shadow-sm text-sm active:scale-95 transition-transform">
                        <i data-lucide="download" class="w-5 h-5"></i>
                        <span id="exportCurrentBtnLabel">Unduh Kelas Aktif</span>
                    </button>

                    <button onclick="exportAllClassesCSV()" class="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3.5 rounded-xl font-bold shadow-md text-sm active:scale-95 transition-transform">
                        <i data-lucide="download" class="w-5 h-5"></i>
                        Unduh Rekap Semua Kelas
                    </button>
                </div>
            </div>

        </main>
    </div>

    <script>
        const defaultClasses = [
            {
                id: 'class_x',
                name: 'Kelas X',
                students: ['Adit', 'Alif', 'Brilian', 'Calvin', 'Dion', 'Elisa', 'Elysia', 'Felisha', 'Geshel', 'Helena', 'Kamila', 'Kanaka', 'Marsel', 'Modesta', 'Nella', 'Pandu', 'Safa', 'Silverio', 'Steven', 'Vino']
            },
            {
                id: 'class_xi_hum',
                name: 'Kelas XI Humaniora',
                students: ['Aga', 'Alve', 'Caca', 'Cheyza', 'Fachri', 'Ignatia', 'Jojo', 'Jovan', 'Kevin', 'Lanna', 'Michelle', 'Noel', 'Rara', 'Sayvina', 'Tia', 'Theo', ]
            },
            {
                id: 'class_xi_tek',
                name: 'Kelas XI Teknik',
                students: ['Alifah', 'Brenda', 'Budi', 'Dane', 'Gladys', 'Jessyca', 'Kianya', 'Lina', 'Naya']
            },
            {
                id: 'class_xii_f2_hum',
                name: 'Kelas XII F2 Humaniora',
                students: ['Abel', 'Ade', 'Agnes', 'Albert', 'Biel', 'Christian', 'Cicil', 'Cika' , 'Elfrand', 'Farrel', 'Luther', 'Mario', 'Rani', 'Rendy', 'Yemima']
            },
            {
                id: 'class_xii_f1_tek',
                name: 'Kelas XII F1 Teknik',
                students: ['Allina', 'Anggel', 'Ansel', 'Bima.', 'Christo', 'Fani', 'Gersom', 'Kasih', 'Kevin', 'Milkha' , 'Nicho']      
            }
        ];

        let classes = JSON.parse(localStorage.getItem('absensi_classes')) || defaultClasses;
        let attendanceData = JSON.parse(localStorage.getItem('absensi_records')) || {};

        let selectedClassId = classes.length > 0 ? classes[0].id : '';
        let currentDate = new Date().toISOString().split('T')[0];

        function saveData() {
            localStorage.setItem('absensi_classes', JSON.stringify(classes));
            localStorage.setItem('absensi_records', JSON.stringify(attendanceData));
        }

        document.addEventListener("DOMContentLoaded", () => {
            const dateInput = document.getElementById('currentDate');
            dateInput.value = currentDate;
            dateInput.addEventListener('change', (e) => {
                currentDate = e.target.value;
                renderUI();
            });
            renderUI();
        });

        function switchTab(tab) {
            ['sectionAbsensi', 'sectionKelola', 'sectionExport'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            
            ['tabBtnAbsensi', 'tabBtnKelola', 'tabBtnExport'].forEach(id => {
                document.getElementById(id).className = "flex-1 md:flex-none flex items-center justify-center gap-2 px-4 sm:px-6 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-white/30";
            });

            if(tab === 'absensi') {
                document.getElementById('sectionAbsensi').classList.remove('hidden');
                document.getElementById('tabBtnAbsensi').className = "flex-1 md:flex-none flex items-center justify-center gap-2 px-4 sm:px-6 py-2.5 rounded-xl font-bold text-sm transition-all bg-white text-blue-700 shadow-sm";
            } else if(tab === 'kelola') {
                document.getElementById('sectionKelola').classList.remove('hidden');
                document.getElementById('tabBtnKelola').className = "flex-1 md:flex-none flex items-center justify-center gap-2 px-4 sm:px-6 py-2.5 rounded-xl font-bold text-sm transition-all bg-white text-blue-700 shadow-sm";
            } else if(tab === 'export') {
                document.getElementById('sectionExport').classList.remove('hidden');
                document.getElementById('tabBtnExport').className = "flex-1 md:flex-none flex items-center justify-center gap-2 px-4 sm:px-6 py-2.5 rounded-xl font-bold text-sm transition-all bg-white text-blue-700 shadow-sm";
            }
            renderUI();
            lucide.createIcons();
        }

        function getCurrentTimeString() {
            const now = new Date();
            return now.toTimeString().slice(0, 5);
        }

        function updateAttendance(studentName, field, value) {
            if(!attendanceData[currentDate]) attendanceData[currentDate] = {};
            if(!attendanceData[currentDate][selectedClassId]) attendanceData[currentDate][selectedClassId] = {};
            if(!attendanceData[currentDate][selectedClassId][studentName]) {
                attendanceData[currentDate][selectedClassId][studentName] = { time: '', s5: '' };
            }
            attendanceData[currentDate][selectedClassId][studentName][field] = value;
            saveData();
        }

        function renderUI() {
            const pillsContainer = document.getElementById('classListPills');
            pillsContainer.innerHTML = '';
            
            classes.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all whitespace-nowrap shadow-sm ${selectedClassId === c.id ? 'bg-blue-600 text-white shadow' : 'bg-white/70 text-slate-600 border border-white/80'}`;
                btn.innerText = c.name;
                btn.onclick = () => {
                    selectedClassId = c.id;
                    renderUI();
                };
                pillsContainer.appendChild(btn);
            });

            let currentClass = classes.find(c => c.id === selectedClassId);
            if(!currentClass && classes.length > 0) {
                selectedClassId = classes[0].id;
                currentClass = classes[0];
            }

            document.getElementById('totalStudentsBadge').innerText = `${currentClass ? currentClass.students.length : 0} Siswa Terdaftar`;
            document.getElementById('exportCurrentBtnLabel').innerText = `Unduh ${currentClass ? currentClass.name : 'Kelas'}`;

            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = '';

            if(currentClass && currentClass.students.length > 0) {
                currentClass.students.forEach((student, index) => {
                    const studentData = attendanceData[currentDate]?.[selectedClassId]?.[student] || { time: '', s5: '' };
                    const isCheck = studentData.s5 === '✅';
                    const isCross = studentData.s5 === '❌';
                    const customVal = (!isCheck && !isCross) ? (studentData.s5 || '') : '';

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-white/20 transition-colors";
                    tr.innerHTML = `
                        <td class="p-3 sm:p-4 text-center text-slate-500 font-semibold text-sm">${index + 1}</td>
                        <td class="p-3 sm:p-4 font-bold text-slate-800 text-sm sm:text-base">${student}</td>
                        <td class="p-3 sm:p-4">
                            <div class="flex items-center gap-1.5">
                                <input type="time" value="${studentData.time || ''}" onchange="updateAttendance('${student}', 'time', this.value)" class="border border-white/60 bg-white/70 rounded-xl p-2.5 text-xs sm:text-sm outline-none font-bold text-slate-700 w-full shadow-inner">
                                <button onclick="updateAttendance('${student}', 'time', getCurrentTimeString()); renderUI();" class="p-2.5 bg-blue-600 text-white rounded-xl shadow-sm active:scale-90" title="Jam Sekarang">
                                    <i data-lucide="clock" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                        <td class="p-3 sm:p-4">
                            <div class="flex items-center gap-1.5 bg-white/40 p-1 rounded-xl border border-white/50 w-full shadow-inner">
                                <button onclick="updateAttendance('${student}', 's5', '✅'); renderUI();" class="p-2 rounded-lg transition-all ${isCheck ? 'bg-emerald-500 text-white shadow' : 'text-slate-500 hover:bg-white/60'}" title="Lengkap">
                                    <i data-lucide="check" class="w-4 h-4" stroke-width="3"></i>
                                </button>
                                <button onclick="updateAttendance('${student}', 's5', '❌'); renderUI();" class="p-2 rounded-lg transition-all ${isCross ? 'bg-rose-500 text-white shadow' : 'text-slate-500 hover:bg-white/60'}" title="Tidak Lengkap">
                                    <i data-lucide="x" class="w-4 h-4" stroke-width="3"></i>
                                </button>
                                <input type="text" placeholder="Ket..." value="${customVal}" oninput="updateAttendance('${student}', 's5', this.value)" class="flex-1 min-w-[80px] bg-white/70 border border-white/80 rounded-lg px-2 py-1.5 text-xs font-semibold text-slate-700 outline-none">
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500 text-sm">Tidak ada data siswa.</td></tr>`;
            }

            renderManageView();
            lucide.createIcons();
        }

        function renderManageView() {
            const select = document.getElementById('manageClassSelect');
            select.innerHTML = '';
            
            if(classes.length === 0) {
                select.innerHTML = '<option value="">- Tidak ada kelas -</option>';
                document.getElementById('editClassContainer').classList.add('hidden');
                document.getElementById('studentListContainer').innerHTML = '';
                return;
            } else {
                document.getElementById('editClassContainer').classList.remove('hidden');
            }

            classes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.innerText = c.name;
                if(c.id === selectedClassId) opt.selected = true;
                select.appendChild(opt);
            });

            const currentClass = classes.find(c => c.id === selectedClassId) || classes[0];
            if(currentClass) {
                document.getElementById('currentClassNameLabel').innerText = currentClass.name;
                document.getElementById('manageStudentsTitle').innerText = `Daftar Siswa (${currentClass.name})`;
                document.getElementById('manageStudentsCountBadge').innerText = `${currentClass.students.length} Total`;

                const container = document.getElementById('studentListContainer');
                container.innerHTML = '';
                currentClass.students.forEach(student => {
                    const card = document.createElement('div');
                    card.className = "flex justify-between items-center bg-white/70 p-3 rounded-xl border border-white/80 shadow-sm";
                    card.innerHTML = `
                        <span class="text-slate-800 font-bold text-xs sm:text-sm">${student}</span>
                        <button onclick="removeStudent('${student}')" class="text-rose-500 p-1.5 hover:bg-rose-500 hover:text-white rounded-lg transition-colors bg-white shadow-sm border border-rose-100" title="Hapus">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function onManageClassChange(id) {
            selectedClassId = id;
            cancelEditClassName();
            renderUI();
        }

        function enableEditClassName() {
            document.getElementById('editClassViewMode').classList.add('hidden');
            document.getElementById('editClassEditMode').classList.remove('hidden');
            const currentClass = classes.find(c => c.id === selectedClassId);
            if(currentClass) document.getElementById('inputEditClassName').value = currentClass.name;
        }

        function cancelEditClassName() {
            document.getElementById('editClassViewMode').classList.remove('hidden');
            document.getElementById('editClassEditMode').classList.add('hidden');
        }

        function saveClassName() {
            const newName = document.getElementById('inputEditClassName').value.trim();
            if(!newName) return;
            classes = classes.map(c => c.id === selectedClassId ? { ...c, name: newName } : c);
            saveData();
            cancelEditClassName();
            renderUI();
        }

        function addNewClass() {
            const input = document.getElementById('inputNewClassName');
            const name = input.value.trim();
            if(!name) return;
            const newId = 'class_' + Date.now();
            classes.push({ id: newId, name: name, students: [] });
            input.value = '';
            selectedClassId = newId;
            saveData();
            renderUI();
        }

        function removeCurrentClass() {
            const currentClass = classes.find(c => c.id === selectedClassId);
            if(!currentClass) return;
            if(!confirm(`Hapus ${currentClass.name} beserta siswanya?`)) return;

            classes = classes.filter(c => c.id !== selectedClassId);
            selectedClassId = classes.length > 0 ? classes[0].id : '';
            saveData();
            renderUI();
        }

        function addNewStudent() {
            const input = document.getElementById('inputNewStudentName');
            const name = input.value.trim();
            if(!name || !selectedClassId) return;

            classes = classes.map(c => {
                if(c.id === selectedClassId) {
                    return { ...c, students: [...c.students, name].sort() };
                }
                return c;
            });
            input.value = '';
            saveData();
            renderUI();
        }

        function removeStudent(studentName) {
            const currentClass = classes.find(c => c.id === selectedClassId);
            if(!confirm(`Hapus ${studentName} dari ${currentClass.name}?`)) return;

            classes = classes.map(c => {
                if(c.id === selectedClassId) {
                    return { ...c, students: c.students.filter(s => s !== studentName) };
                }
                return c;
            });
            saveData();
            renderUI();
        }

        function exportCurrentClassCSV() {
            const currentClass = classes.find(c => c.id === selectedClassId);
            if(!currentClass) return;
            const dateData = attendanceData[currentDate] || {};
            const classData = dateData[selectedClassId] || {};

            let csvContent = "Tanggal,Kelas,No,Nama,Jam Kedatangan,Keterangan 5S\n";
            currentClass.students.forEach((student, index) => {
                const data = classData[student] || { time: '-', s5: '-' };
                csvContent += [currentDate, currentClass.name, index + 1, student, data.time || '-', data.s5 || '-'].join(",") + "\n";
            });
            downloadCSV(csvContent, `Absensi_${currentClass.name}_${currentDate}.csv`);
        }

        function exportAllClassesCSV() {
            let csvContent = "Tanggal,Kelas,No,Nama,Jam Kedatangan,Keterangan 5S\n";
            classes.forEach(cls => {
                const classData = attendanceData[currentDate]?.[cls.id] || {};
                cls.students.forEach((student, index) => {
                    const data = classData[student] || { time: '-', s5: '-' };
                    csvContent += [currentDate, cls.name, index + 1, student, data.time || '-', data.s5 || '-'].join(",") + "\n";
                });
            });
            downloadCSV(csvContent, `Rekap_Absensi_Semua_Kelas_${currentDate}.csv`);
        }

        function downloadCSV(content, filename) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
